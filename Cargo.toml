[package]
name = "biu"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["Dominic"]


#[[bin]]
#name = "biu"
#path = "src/main.rs"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "^0.4"
clap = { version = "^4.5", features = ["derive"] }
regex = "^1.10"
toml = "^0.8.8"
serde = { version = "^1.0", features = ["derive"] }
cuckoofilter = "^0.5"
log = "0.4.22"
env_logger = "0.11.5"

[dev-dependencies]
tempfile = "^3.8"
assert_cmd = "2.0"

[dependencies.xxhash-rust]
version = "0.8.7"
features = ["xxh3"]
